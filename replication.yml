# replication.yml - rep-10.1257-aer.20250166
#
# Hahn, Hendren, Metcalfe & Sprung-Keyser, "A Welfare Analysis of Policies Impacting
# Climate Change", American Economic Review (OpenICPSR deposit 239169-V1).
#
# STATUS: main text only (Table 1-2, Figures 1-8). Confirmed with the
# maintainer as a wrapper-script-granularity DAG - NOT one node per policy (the
# deposit has ~100 policy do-files feeding a handful of wrapper scripts; see
# onboarding_notes/openicpsr-aer-239169.md). Appendix tables/figures, the 1000-rep
# bootstrap (App. Table 4 CIs), and the MATLAB-dependent publication-bias branch are
# Phase 2 and deliberately NOT declared here yet.
#
# LBD COST-CURVE / MVPF PATHS:
# - cost_curve_data_r (engine: r) builds/validates the R LBD kernel dataset;
#   live Stata steps that need LBD take it as a parents: handoff.
# - Mathematica is NOT a separate sidebar step. It appears only as the greyed
#   [Stata / Mathematica] path alternative on group: compute_mvpf_main
#   (compute_mvpf_main_mathematica). Operable path is languages: [stata, r].
#   R is a translation of the Mathematica cost-curve kernel; Stata owns the
#   policy orchestration. No pure-R MVPF pipe.
# See README.

# OTHER NOTES:
#   1. Data: policy_details_v3.xlsx at deposit data/ root - committed as
#      data/policy_details_v3.xlsx.
#   2. No precomputed gold outputs in the OpenICPSR deposit - bake locally
#      (Stata + R for LBD; Mathematica only if using the original-engine path).
#   3. compute_mvpf_main is a long full-sample batch; light figs recomputes one policy.

paper:
  doi: https://doi.org/10.1257/aer.20250166
  title: "A Welfare Analysis of Policies Impacting Climate Change"
  journal: American Economic Review
  year: 2026   # TBD - README (dated March 2026) predates confirmed AER issue/volume
  authors: Robert W. Hahn, Nathaniel Hendren, Robert D. Metcalfe, Ben Sprung-Keyser
  source_repository:
    - https://github.com/Policy-Impacts/mvpf-climate
    - https://www.openicpsr.org/openicpsr/project/239169/version/V1/view
  study_folder: rep-10.1257-aer.20250166
  source_note: >
    Primary: public GitHub (Policy-Impacts/mvpf-climate) — passwordless and
    more complete than the OpenICPSR zip used for the initial Pattern-B
    data/ commit (includes policies/robustness/ and figures_data/avgs_*.dta
    needed by fig_2/3/4/7/8). Secondary: AER OpenICPSR deposit 239169-V1
    (official journal deposit; Cloudflare-gated, no per-file API). Study
    data/ remains Pattern B (committed under data/); no live remote-fetch
    step — GitHub is the materials credit / gap-fill source, not a
    replacement for the committed deposit wiring.
  abstract: >
    Learning-by-doing (LBD) cost-curve kernel: original Mathematica scripts are
    retained under code/original/cost_curve/. Live replication defaults to an R
    reimplementation (code/cost_curve/) invoked from Stata via
    cost_curve_masterfile.ado. Original Mathematica appears only as the greyed
    [Stata / Mathematica] path on compute_mvpf_main (needs wolframscript).
    Numerical fidelity vs Mathematica is spot-check status only (see README).
  dependencies:
    - deSolve

maintainer:
  name: Macartan Humphreys
  email: macartan.humphreys@wzb.eu

collections:
  - AER

repo: replicate-anything/rep-10.1257-aer.20250166

# Stata wrappers; R is the default LBD cost-curve engine; Mathematica is the
# optional path alternative on compute_mvpf_main (not a standalone sidebar step).
languages:
  - stata
  - r
  - mathematica

# masterfile.do installs 5 SSC packages up front: filelist, maptile, spmap, gtools,
# missings. maptile/spmap are appendix-map-only (Phase 2, not needed here). filelist
# is avoided in our runners (we use a plain `dir` local instead - see
# code/compute_mvpf_main.do). reclink and missings ARE genuinely needed by
# wrapper/clean_data.do and its data_cleaning/*.do children (confirmed empirically -
# see onboarding_notes/openicpsr-aer-239169.md "Round 2"); gtools is declared
# defensively since several policy do-files use gtools commands (gcollapse/gegen)
# for speed on the full ~100-policy run. All 3 require internet access to
# `ssc install` on first use.
stata_packages:
  - reclink
  - missings
  - gtools
  - labutil   # labmask used by figtab/mvpf_plots_nudges.do (fig_5)

steps:
  # ---------------------------------------------------------------------------
  # Shared prep (root inputs -> externality globals every policy do-file needs)
  # ---------------------------------------------------------------------------
  - id: clean_data
    type: transform
    label: Clean input data
    description: >
      Builds battery/EV/CPI/population inputs from data/1_assumptions
      (wrapper/clean_data.do + data_cleaning/*.do, unmodified author code).
    # root step - omit parents
    engine: stata
    inputs:
      - data/1_assumptions/policy_category_assumptions_MASTER.xlsx
      - data/1_assumptions/evs
      - data/1_assumptions/gas_vehicles
      - data/1_assumptions/diesel_vehicles
    code: code/clean_data.do
    outputs:
      - outputs/clean_data/.done
    products:
      - data/1_assumptions/evs
      - data/1_assumptions/gas_vehicles
      - data/1_assumptions/diesel_vehicles

  - id: macros
    type: transform
    label: Build externality macros
    description: >
      Warms shared electricity/gas/vehicle externality globals and cached
      datasets every policy do-file reads (wrapper/macros.do via a cheap
      throwaway metafile.do call).
    parents:
      - clean_data
    engine: stata
    code: code/macros.do
    outputs:
      - outputs/macros/.done
    products:
      - data/1_assumptions/user_specific_assumptions

  # ---------------------------------------------------------------------------
  # LBD cost-curve data build (R) — standalone validation gate for the shared
  # kernel. Mathematica is NOT declared here as a second sidebar step; it is
  # only the greyed path on compute_mvpf_main below.
  # ---------------------------------------------------------------------------
  - id: cost_curve_data_r
    type: transform
    label: LBD cost-curve data (R translation)
    path_note: >
      R translation of the original Mathematica LBD kernel; Stata shells to
      this shared dataset for live MVPF / LBD figures.
    description: >
      R step added by replicateEverything (original deposit has no R).
      Builds/validates the shared LBD cost-curve kernel that Stata shells to
      for live MVPF and LBD figures; original Mathematica remains optional.
    engine: r
    code: code/cost_curve/build_cost_curve_data.R
    outputs:
      - outputs/cost_curve_data_r/lbd_cost_curve.csv
    dependencies:
      - deSolve

  # ---------------------------------------------------------------------------
  # Heavy full-sample computation — multi-language path group
  # (Stata + R LBD translation vs Stata + original Mathematica LBD).
  # Shiny shows [Stata / R] | [Stata / Mathematica] path boxes.
  # ---------------------------------------------------------------------------
  - id: compute_mvpf_main
    group: compute_mvpf_main
    languages:
      - stata
      - r
    type: transform
    label: Compute MVPF (main)
    path_note: R is a translation of the original Mathematica LBD kernel
    description: >
      Headline MVPF batch (Stata orchestrator). R path uses the LBD cost-curve
      translation of the original Mathematica kernel (validated by
      cost_curve_data_r). Long full-sample run.
    parents:
      - macros
      - cost_curve_data_r
    engine: stata
    code: code/compute_mvpf_main.do
    outputs:
      - outputs/compute_mvpf_main/compiled_results_all_uncorrected_vJK.dta
      # Also stages data/4_results/full_current_193/ (gitignored regenerable alias).
      # Author figtab scripts hardcode ${code_files}/4_results/<stub>; init_study_paths
      # restores that alias from this outputs/ sink when missing.

  - id: compute_mvpf_main_mathematica
    group: compute_mvpf_main
    languages:
      - stata
      - mathematica
    type: transform
    label: Compute MVPF (main; original Mathematica LBD)
    path_note: Original Mathematica / wolframscript LBD kernel (optional)
    description: >
      Same headline MVPF batch with the original Mathematica LBD kernel.
      Incomplete here when wolframscript is missing.
    parents:
      - macros
    engine: stata
    code: code/compute_mvpf_main_mathematica.do
    outputs:
      - outputs/compute_mvpf_main_mathematica/compiled_results_all_uncorrected_vJK.dta
    incomplete: true
    requires_engine: mathematica
    blocked_reason: >
      Original Mathematica LBD path for compute_mvpf_main. Operable default is
      Stata + R (translation). Needs wolframscript on PATH.

  - id: compute_mvpf_no_lbd
    type: transform
    label: Compute MVPF (no learning-by-doing)
    description: >
      Same full-sample run with learning-by-doing off - Stata-only, no
      Mathematica needed. Exists only because tab_2 compares MVPF/cost-per-ton
      with vs. without learning-by-doing.
    parents:
      - macros
    engine: stata
    code: code/compute_mvpf_no_lbd.do
    outputs:
      - outputs/compute_mvpf_no_lbd/compiled_results_all_uncorrected_vJK.dta

  # ---------------------------------------------------------------------------
  # Light figures - single-policy recompute, do not need compute_mvpf_main
  # ---------------------------------------------------------------------------
  - id: fig_1
    type: figure
    label: Figure 1
    description: EV subsidy waterfall (Muehlegger & Rapson EV FMP); LBD via R cost-curve
    parents:
      - macros
      - cost_curve_data_r
    engine: stata
    code: code/fig_1.do
    outputs:
      - outputs/waterfall_muehl_efmp_current.png

  - id: fig_2
    type: figure
    label: Figure 2
    description: >
      Wind PTC waterfall (2a) + wind/solar elasticities (2b). wind_solar_paper.do
      produces both the 2b and 3b panels in one pass - fig_3 reuses the 3b
      output rather than re-running it. LBD via R cost-curve default.
    parents:
      - macros
      - cost_curve_data_r
    engine: stata
    code: code/fig_2.do
    outputs:
      - outputs/waterfall_hitaj_ptc_current.png
      - outputs/Fig_2b_wind_elasticities.png
    # Unblocked by pulling policies/robustness/ (and program_specific /
    # uncorrected_vJK testing workbooks) from Policy-Impacts/mvpf-climate —
    # those paths were absent from the OpenICPSR zip used for the initial
    # Pattern-B data/ commit.

  - id: fig_3
    type: figure
    label: Figure 3
    description: >
      Solar waterfall (3a, Pless & Van Benthem) + solar elasticities (3b,
      produced by fig_2's wind_solar_paper.do run). LBD via R cost-curve.
    parents:
      - fig_2
      - cost_curve_data_r
    engine: stata
    code: code/fig_3.do
    outputs:
      - outputs/waterfall_pless_ho_current.png
      - outputs/Fig_3b_solar_elasticities.png
    # Same GitHub-sourced robustness inputs as fig_2 (solar_testing.do).

  - id: fig_5
    type: figure
    label: Figure 5
    description: >
      Home Energy Report (nudges) MVPF correlation plot. Does not depend on
      compute_mvpf_main - reads data/5_graphs/figures_data/Nudge Estimates.xlsx
      (manually compiled HER RCT metadata) directly. Stata-only (no LBD kernel).
      Live Run is slow (~8–12 min): warm_session reloads macros caches, then
      mvpf_plots_nudges loops dynamic_split_grid over each HER estimate.
      Not waiting for input (set more off / pause off /e /i). Default
      stata_timeout 900s is enough; Display uses the baked PNG.
    parents:
      - macros
    engine: stata
    inputs:
      - data/5_graphs/figures_data/Nudge Estimates.xlsx
    code: code/fig_5.do
    outputs:
      - outputs/corr_plot_nudges.png

  - id: fig_6
    type: figure
    label: Figure 6
    description: Long-run gas tax waterfall (small_gas_lr); LBD via R cost-curve
    parents:
      - macros
      - cost_curve_data_r
    engine: stata
    code: code/fig_6.do
    outputs:
      - outputs/waterfall_small_gas_lr_current.png

  # ---------------------------------------------------------------------------
  # Aggregate figures/tables - need the full compiled sample (compute_mvpf_main).
  # policy_details_v3.xlsx is present at data/policy_details_v3.xlsx.
  # ---------------------------------------------------------------------------
  - id: fig_4
    type: figure
    label: Figure 4
    description: Baseline MVPFs for subsidies.
    parents:
      - compute_mvpf_main
    engine: stata
    inputs:
      - data/policy_details_v3.xlsx
    code: code/fig_4.do
    outputs:
      - outputs/mvpf_subsidies_Fig4_scc193.png
    # Unblocked by committing data/5_graphs/figures_data/
    # avgs_current_193_yes_no_yes_v3.dta from Policy-Impacts/mvpf-climate
    # (precomputed category MVPF CI bounds; absent from OpenICPSR zip).

  - id: fig_7
    type: figure
    label: Figure 7
    description: MVPF plot of revenue raisers.
    parents:
      - compute_mvpf_main
    engine: stata
    inputs:
      - data/policy_details_v3.xlsx
    code: code/fig_7.do
    outputs:
      - outputs/mvpf_taxes_Fig7_scc193_with_CIs.png
    # Same GitHub-sourced avgs_*.dta as fig_4.

  - id: fig_8
    type: figure
    label: Figure 8
    description: MVPF plot of international policies.
    parents:
      - compute_mvpf_main
    engine: stata
    inputs:
      - data/policy_details_v3.xlsx
    code: code/fig_8.do
    outputs:
      # README's own Table 3 lists this file as "mvpf_intl_Ap_Fig4_split_with_CIs.png"
      # (likely a copy-paste slip in the author README); the actual `graph export`
      # line in figtab/mvpf_plots.do names it from the plot_name argument passed by
      # wrapper/figures.do ("Fig8_scc193") - trusting the code over the README table.
      - outputs/mvpf_intl_Fig8_scc193_with_CIs.png
    # Same GitHub-sourced avgs_*.dta as fig_4.

  - id: tab_1
    type: table
    label: Table 1
    description: >
      Baseline MVPF components (main text). Output is the author's native
      template xlsx; no HTML preview wired yet.
    parents:
      - compute_mvpf_main
    engine: stata
    inputs:
      - data/policy_details_v3.xlsx
    code: code/tab_1.do
    outputs:
      - outputs/Table1_scc193_main.xlsx

  - id: tab_2
    type: table
    label: Table 2
    description: >
      MVPF vs. cost-per-ton, with and without learning-by-doing. Needs
      compute_mvpf_main and compute_mvpf_no_lbd.
    parents:
      - compute_mvpf_main
      - compute_mvpf_no_lbd
    engine: stata
    inputs:
      - data/policy_details_v3.xlsx
    code: code/tab_2.do
    outputs:
      - outputs/Table2_CE_Table_Avg_scc193.xlsx
