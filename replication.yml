# replication.yml - rep-10.1257-aer.20250166
#
# Hahn, Hendren, Metcalfe & Sprung-Keyser, "A Welfare Analysis of Policies Impacting
# Climate Change", American Economic Review (OpenICPSR deposit 239169-V1).
#
# STATUS: v1 scaffold, main text only (Table 1-2, Figures 1-8). Confirmed with the
# maintainer as a wrapper-script-granularity DAG - NOT one node per policy (the
# deposit has ~100 policy do-files feeding a handful of wrapper scripts; see
# onboarding_notes/openicpsr-aer-239169.md). Appendix tables/figures, the 1000-rep
# bootstrap (App. Table 4 CIs), and the MATLAB-dependent publication-bias branch are
# Phase 2 and deliberately NOT declared here yet.
#
# KNOWN GAPS (see onboarding_notes/openicpsr-aer-239169.md for detail):
#   1. Software: most policy do-files that touch learning-by-doing (incl. "light"
#      single-policy waterfalls fig_1/2/3/6) shell out to wolframscript via
#      cost_curve_masterfile. Only fig_5 (nudges) is Stata-only among main-text
#      display figs here. compute_mvpf_main + aggregate figs/tables also need it.
#      compute_mvpf_no_lbd is the Stata-only robustness twin for Table 2.
#   2. Data: policy_details_v3.xlsx lives at deposit data/ root (code_files =
#      dropbox = data/). Committed as data/policy_details_v3.xlsx.
#   3. No precomputed gold outputs ship in the OpenICPSR deposit - bake locally
#      on a machine with Stata (+ Mathematica for LBD steps).

paper:
  doi: https://doi.org/10.1257/aer.20250166
  title: "A Welfare Analysis of Policies Impacting Climate Change"
  journal: American Economic Review
  year: 2026   # TBD - README (dated March 2026) predates confirmed AER issue/volume
  authors: Robert W. Hahn, Nathaniel Hendren, Robert D. Metcalfe, Ben Sprung-Keyser
  source_repository: https://www.openicpsr.org/openicpsr/project/239169/version/V1/view?path=/openicpsr/239169/fcr:versions/V1/data/0_log
  study_folder: rep-10.1257-aer.20250166
  source_note: >
    OpenICPSR deposit 239169-V1. No public per-file fetch API (Cloudflare/JS-gated
    project page) - data committed under data/ (Pattern B) rather than fetched live.

maintainer:
  name: Macartan Humphreys
  email: macartan.humphreys@wzb.eu

collections:
  - AER

repo: replicate-anything/rep-10.1257-aer.20250166

# Engines used in this study. Stata runs the wrappers; Mathematica
# (wolframscript) is required for LBD / cost-curve steps (see requires_engine:).
languages:
  - stata
  - mathematica

# masterfile.do installs 5 SSC packages up front: filelist, maptile, spmap, gtools,
# missings. maptile/spmap are appendix-map-only (Phase 2, not needed here). filelist
# is avoided in our runners (we use a plain `dir` local instead - see
# code/compute_mvpf_main.do). reclink and missings ARE genuinely needed by
# wrapper/clean_data.do and its data_cleaning/*.do children (confirmed empirically -
# see onboarding_notes/openicpsr-aer-239169.md "Round 2"); gtools is declared
# defensively since several policy do-files use gtools commands (gcollapse/gegen)
# for speed on the full ~100-policy run. All 3 require internet access to
# `ssc install` on first use.
stata_packages:
  - reclink
  - missings
  - gtools
  - labutil   # labmask used by figtab/mvpf_plots_nudges.do (fig_5)

steps:
  # ---------------------------------------------------------------------------
  # Shared prep (root inputs -> externality globals every policy do-file needs)
  # ---------------------------------------------------------------------------
  - id: clean_data
    type: transform
    label: Clean input data
    description: >
      Builds battery/EV/CPI/population inputs from data/1_assumptions
      (wrapper/clean_data.do + data_cleaning/*.do, unmodified author code).
    # root step - omit parents
    engine: stata
    inputs:
      - data/1_assumptions/policy_category_assumptions_MASTER.xlsx
      - data/1_assumptions/evs
      - data/1_assumptions/gas_vehicles
      - data/1_assumptions/diesel_vehicles
    code: code/clean_data.do
    outputs:
      - outputs/clean_data/.done

  - id: macros
    type: transform
    label: Build externality macros
    description: >
      Warms the shared electricity/gas/vehicle externality globals and cached
      datasets every policy do-file reads (wrapper/macros.do), via one cheap
      throwaway metafile.do call - same pattern as the author's own
      ado/reset_globals.ado.
    parents:
      - clean_data
    engine: stata
    code: code/macros.do
    outputs:
      - outputs/macros/.done

  # ---------------------------------------------------------------------------
  # Heavy full-sample computation (needs Mathematica for the LBD policy subset)
  # ---------------------------------------------------------------------------
  - id: compute_mvpf_main
    type: transform
    label: Compute MVPF (main, LBD on)
    description: >
      Headline run: metafile.do "current" scc=193 lbd=yes over every policy in
      policies/harmonized, reps=0 (point estimates only - bootstrapping is
      Phase 2). Produces the compiled cross-policy results tab_1/fig_4/fig_7/
      fig_8 read. Needs `wolframscript` (Mathematica) for ~10 EV/solar/hybrid
      policies; will fail on those without it (see code/compute_mvpf_main.do).
    parents:
      - macros
    engine: stata
    code: code/compute_mvpf_main.do
    outputs:
      - outputs/compute_mvpf_main/compiled_results_all_uncorrected_vJK.dta
      # Author-native alias also written (data/4_results/full_current_193/...) - the
      # downstream author scripts (mvpf_plots.do, excel_MVPF_tables_condensed.do, ...)
      # hardcode ${code_files}/4_results/<run name> and cannot be pointed at outputs/
      # without editing them.
    # BLOCKED: bootstrap_wrapper.do calls each policy's do-file uncaptured
    # (no `capture` around the per-policy `do`), so the first LBD-on policy
    # that shells out to wolframscript (typically bento_gas alphabetically)
    # exits r(601) after cost_curve_masterfile's 20s CSV wait - no partial
    # compiled_results. ~40 policies need Mathematica when lbd=yes (7 EV/
    # hybrid direct, ~9 wind, ~6 solar, ~18 gas taxes with year>2011), not
    # merely ~10. OpenICPSR 239169-V1 ships empty placeholders in
    # data/4_results (no gold compiled_results*.dta); study outputs/ has none
    # either - cannot Display from a precomputed parent or given="parents".
    incomplete: true
    requires_engine: mathematica
    blocked_reason: >
      Requires Mathematica (wolframscript on PATH) for ~40 of ~100 policies
      when lbd=yes (EV/hybrid, wind, solar, and gas-tax cost curves). Not
      installed here; no shipped compiled_results in the deposit or under
      outputs/compute_mvpf_main/. First failure is early (often bento_gas)
      with r(601) and no partial output. Stata-only twin compute_mvpf_no_lbd
      is a different robustness specification, not a headline substitute.

  - id: compute_mvpf_no_lbd
    type: transform
    label: Compute MVPF (no learning-by-doing)
    description: >
      Same full-sample run with learning-by-doing off - Stata-only, no
      Mathematica needed. Exists only because tab_2 compares MVPF/cost-per-ton
      with vs. without learning-by-doing.
    parents:
      - macros
    engine: stata
    code: code/compute_mvpf_no_lbd.do
    outputs:
      - outputs/compute_mvpf_no_lbd/compiled_results_all_uncorrected_vJK.dta

  # ---------------------------------------------------------------------------
  # Light figures - single-policy recompute, do not need compute_mvpf_main
  # ---------------------------------------------------------------------------
  - id: fig_1
    type: figure
    label: Figure 1
    description: EV subsidy waterfall (Muehlegger & Rapson EV FMP)
    parents:
      - macros
    engine: stata
    code: code/fig_1.do
    outputs:
      - outputs/waterfall_muehl_efmp_current.png
    incomplete: true
    requires_engine: mathematica
    blocked_reason: >
      muehl_efmp calls cost_curve_masterfile → wolframscript (Mathematica).
      Not installed here; CSV wait fails with r(601).

  - id: fig_2
    type: figure
    label: Figure 2
    description: >
      Wind PTC waterfall (2a) + wind/solar elasticities (2b). wind_solar_paper.do
      produces both the 2b and 3b panels in one pass - fig_3 reuses the 3b
      output rather than re-running it.
    parents:
      - macros
    engine: stata
    code: code/fig_2.do
    outputs:
      - outputs/waterfall_hitaj_ptc_current.png
      - outputs/Fig_2b_wind_elasticities.png
    incomplete: true
    requires_engine: mathematica
    blocked_reason: >
      hitaj_ptc / wind_ado learning-by-doing path calls cost_curve_masterfile
      → wolframscript (Mathematica). Not installed here.

  - id: fig_3
    type: figure
    label: Figure 3
    description: >
      Solar waterfall (3a, Pless & Van Benthem) + solar elasticities (3b,
      produced by fig_2's wind_solar_paper.do run).
    parents:
      - fig_2
    engine: stata
    code: code/fig_3.do
    outputs:
      - outputs/waterfall_pless_ho_current.png
      - outputs/Fig_3b_solar_elasticities.png
    incomplete: true
    requires_engine: mathematica
    blocked_reason: >
      Depends on fig_2 (Mathematica) and pless_ho is also on the LBD /
      cost_curve path.

  - id: fig_5
    type: figure
    label: Figure 5
    description: >
      Home Energy Report (nudges) MVPF correlation plot. Does not depend on
      compute_mvpf_main - reads data/5_graphs/figures_data/Nudge Estimates.xlsx
      (manually compiled HER RCT metadata) directly. Stata-only (no Mathematica).
      Live Run is slow (~8–12 min): warm_session reloads macros caches, then
      mvpf_plots_nudges loops dynamic_split_grid over each HER estimate.
      Not waiting for input (set more off / pause off /e /i). Default
      stata_timeout 900s is enough; Display uses the baked PNG.
    parents:
      - macros
    engine: stata
    inputs:
      - data/5_graphs/figures_data/Nudge Estimates.xlsx
    code: code/fig_5.do
    outputs:
      - outputs/corr_plot_nudges.png

  - id: fig_6
    type: figure
    label: Figure 6
    description: Long-run gas tax waterfall (small_gas_lr)
    parents:
      - macros
    engine: stata
    code: code/fig_6.do
    outputs:
      - outputs/waterfall_small_gas_lr_current.png
    incomplete: true
    requires_engine: mathematica
    blocked_reason: >
      small_gas_lr → run_gas_tax → cost_curve_masterfile → wolframscript
      (Mathematica). Not installed here.

  # ---------------------------------------------------------------------------
  # Aggregate figures/tables - need the full compiled sample (blocked on
  # Mathematica via compute_mvpf_main). policy_details_v3.xlsx is present at
  # data/policy_details_v3.xlsx (= ${code_files}/policy_details_v3.xlsx).
  # ---------------------------------------------------------------------------
  - id: fig_4
    type: figure
    label: Figure 4
    description: >
      Baseline MVPFs for subsidies. Blocked on compute_mvpf_main (Mathematica).
    parents:
      - compute_mvpf_main
    engine: stata
    inputs:
      - data/policy_details_v3.xlsx
    code: code/fig_4.do
    outputs:
      - outputs/mvpf_subsidies_Fig4_scc193.png
    incomplete: true
    requires_engine: mathematica
    blocked_reason: >
      Depends on compute_mvpf_main, which requires Mathematica (wolframscript)
      for ~10 EV/solar/hybrid learning-by-doing policies.

  - id: fig_7
    type: figure
    label: Figure 7
    description: >
      MVPF plot of revenue raisers. Blocked on compute_mvpf_main (Mathematica).
    parents:
      - compute_mvpf_main
    engine: stata
    inputs:
      - data/policy_details_v3.xlsx
    code: code/fig_7.do
    outputs:
      - outputs/mvpf_taxes_Fig7_scc193_with_CIs.png
    incomplete: true
    requires_engine: mathematica
    blocked_reason: >
      Depends on compute_mvpf_main, which requires Mathematica (wolframscript)
      for ~10 EV/solar/hybrid learning-by-doing policies.

  - id: fig_8
    type: figure
    label: Figure 8
    description: >
      MVPF plot of international policies. Blocked on compute_mvpf_main
      (Mathematica).
    parents:
      - compute_mvpf_main
    engine: stata
    inputs:
      - data/policy_details_v3.xlsx
    code: code/fig_8.do
    outputs:
      # README's own Table 3 lists this file as "mvpf_intl_Ap_Fig4_split_with_CIs.png"
      # (likely a copy-paste slip in the author README); the actual `graph export`
      # line in figtab/mvpf_plots.do names it from the plot_name argument passed by
      # wrapper/figures.do ("Fig8_scc193") - trusting the code over the README table.
      - outputs/mvpf_intl_Fig8_scc193_with_CIs.png
    incomplete: true
    requires_engine: mathematica
    blocked_reason: >
      Depends on compute_mvpf_main, which requires Mathematica (wolframscript)
      for ~10 EV/solar/hybrid learning-by-doing policies.

  - id: tab_1
    type: table
    label: Table 1
    description: >
      Baseline MVPF components (main text). Blocked on compute_mvpf_main
      (Mathematica). Output is the author's native template xlsx; no HTML
      preview wired yet.
    parents:
      - compute_mvpf_main
    engine: stata
    inputs:
      - data/policy_details_v3.xlsx
    code: code/tab_1.do
    outputs:
      - outputs/Table1_scc193_main.xlsx
    incomplete: true
    requires_engine: mathematica
    blocked_reason: >
      Depends on compute_mvpf_main, which requires Mathematica (wolframscript)
      for ~10 EV/solar/hybrid learning-by-doing policies.

  - id: tab_2
    type: table
    label: Table 2
    description: >
      MVPF vs. cost-per-ton, with and without learning-by-doing. Blocked on
      compute_mvpf_main (Mathematica); also needs compute_mvpf_no_lbd.
    parents:
      - compute_mvpf_main
      - compute_mvpf_no_lbd
    engine: stata
    inputs:
      - data/policy_details_v3.xlsx
    code: code/tab_2.do
    outputs:
      - outputs/Table2_CE_Table_Avg_scc193.xlsx
    incomplete: true
    requires_engine: mathematica
    blocked_reason: >
      Depends on compute_mvpf_main, which requires Mathematica (wolframscript)
      for ~10 EV/solar/hybrid learning-by-doing policies.
